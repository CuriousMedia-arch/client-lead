name: Release overdue leads

# The claim clocks need something to tick them whether or not anyone is logged
# in. Which mechanism does that depends on where this is deployed:
#
#   Render / local  - services/scheduler.js runs an in-process timer every 15
#                     minutes. This workflow is belt-and-braces there, though
#                     it does one genuinely useful thing: Render's free tier
#                     sleeps an idle instance, and a request wakes it up.
#
#   Vercel          - there is no always-on process for a timer to live in, and
#                     Vercel Cron on the Hobby plan only allows one run a day.
#                     So this is the real scheduler for a Vercel deployment.
#
# It just calls the endpoint. All the logic is in lib/sweeps.js, shared with the
# in-process cron and the web requests, so there is only ever one definition of
# what "overdue" means.

on:
  schedule:
    # Every 15 minutes. GitHub queues scheduled runs and can be a few minutes
    # late under load, which is irrelevant for deadlines measured in hours.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # so an admin can force a sweep from the Actions tab

# Two sweeps running at once would be harmless — every query only touches rows
# that are genuinely overdue and then makes them not-overdue — but there is no
# reason to pay for the overlap.
concurrency:
  group: lead-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ask the app to release anything overdue
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set in repository secrets — skipping."
            echo "Set both under Settings → Secrets and variables → Actions."
            exit 0
          fi

          # --fail-with-body so a 401 or 500 fails the job AND prints what the
          # app said. A silent green tick on a sweep that never ran is the
          # exact failure this workflow exists to prevent.
          curl --silent --show-error --fail-with-body \
               --max-time 60 \
               --header "x-cron-secret: $CRON_SECRET" \
               "${APP_URL%/}/api/cron/sweep"
