<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Curious Media &middot; Lead Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/outreach.css" />
</head>
<body>

<!-- ── Sign in ───────────────────────────────────────────────────────────── -->
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <p class="eyebrow"><span class="dot"></span>Lead intelligence</p>
    <h1 class="wordmark">Curious <span>Media</span></h1>
    <p class="login-sub">Sign in to pick up today's leads.</p>

    <label class="field">
      <span>Username</span>
      <input name="username" autocomplete="username" autofocus required />
    </label>
    <label class="field">
      <span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required />
    </label>

    <p class="form-error" id="login-error" hidden></p>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
</div>

<!-- ── App ───────────────────────────────────────────────────────────────── -->
<div id="app" hidden>

  <header class="topbar">
    <div class="brand">
      <p class="eyebrow"><span class="dot"></span>Lead intelligence</p>
      <h1 class="wordmark">Curious <span>Media</span></h1>
    </div>
    <div class="whoami">
      <div class="bell-wrap">
        <button class="btn btn-ghost bell-btn" id="bell-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" class="bell-icon" aria-hidden="true">
            <path d="M12 22a2.2 2.2 0 002.2-2.2h-4.4A2.2 2.2 0 0012 22zM18 16v-5a6 6 0 00-5-5.92V4a1 1 0 10-2 0v1.08A6 6 0 006 11v5l-1.6 1.6A1 1 0 005 19h14a1 1 0 00.7-1.7L18 16z"/>
          </svg>
          <span class="bell-dot" id="bell-dot" hidden></span>
        </button>
        <div class="bell-panel" id="bell-panel" hidden></div>
      </div>
      <div class="whoami-text">
        <strong id="me-name">—</strong>
        <span id="me-role">—</span>
      </div>
      <button class="btn btn-ghost" id="signout">Sign out</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="all">All Leads <span class="pill" data-count="all">0</span></button>
    <button class="tab" data-tab="fresh">Fresh Leads <span class="pill" data-count="fresh">0</span></button>
    <button class="tab" data-tab="mine">My Outreach <span class="pill" data-count="mine">0</span></button>
    <button class="tab" data-tab="newspaper">Newspaper <span class="pill" data-count="newspaper">0</span></button>
    <button class="tab" data-tab="admin" id="tab-admin">Admin</button>
  </nav>

  <main class="layout" id="layout">

    <section class="content" id="content"></section>
  </main>
</div>

<!-- ── Lead drawer ───────────────────────────────────────────────────────── -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<!-- ── Admin contact editor ─────────────────────────────────────────────────── -->
<div class="drawer-backdrop" id="contact-editor-backdrop" hidden></div>
<aside class="drawer" id="contact-editor" hidden aria-label="Edit contact"></aside>

<aside class="drawer" id="drawer" hidden aria-label="Lead detail"></aside>

<!-- Unclaimed Fresh Leads used to be a stat card that opened this panel. It's a
     block inside the Admin tab now, so there's nothing to pop up. -->

<!-- ── Generic modal (New Lead, Request extension) ──────────────────────────── -->
<div class="drawer-backdrop" id="modal-backdrop" hidden></div>
<div class="modal-box" id="modal-box" hidden></div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
<script src="/outreach.js"></script>
</body>
</html>
