# Render blueprint. Point Render at this repo and it reads this file instead
# of you filling in the form by hand.
#
# Data lives in Supabase, not on disk, so the free instance type is fine —
# there's nothing to persist locally and nothing to lose when it restarts.
#
# One caveat with `plan: free`: Render sleeps an idle instance, and a sleeping
# instance runs no in-process cron, so claim deadlines would stall overnight.
# The GitHub Actions sweep (.github/workflows/sweep.yml) covers that — its
# request wakes the instance and ticks the clocks. On a paid plan the
# in-process timer in services/scheduler.js is enough on its own.
services:
  - type: web
    name: curious-lead-intelligence
    runtime: node
    plan: free
    region: singapore          # closest Render region to Mumbai
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false            # set in the dashboard, never committed
      - key: NEWSAPI_AI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: TZ_NAME
        value: Asia/Kolkata
      # Lets the GitHub Actions sweep call /api/cron/sweep. Without it that
      # endpoint refuses every request rather than running unauthenticated.
      - key: CRON_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
